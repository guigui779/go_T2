<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Go V5 管理后台</title>
<link rel="stylesheet" href="/admin.css">
</head>
<body>

<div class="topbar">
  <span class="logo">Go V5</span>
  <nav>
    <a class="tab active" data-tab="domains">域名管理</a>
    <a class="tab" data-tab="relay">中继配置</a>
    <a class="tab" data-tab="settings">站点设置</a>
  </nav>
</div>

<div class="wrap">

  <!-- ===== 域名管理 ===== -->
  <section id="tab-domains" class="tab-content">
    <!-- 工具栏 -->
    <div class="toolbar">
      <div>
        <input type="text" id="dom_search" placeholder="搜索域名/名称" class="inp" style="width:200px">
        <select id="dom_tag" class="inp" style="width:120px"><option value="">全部标签</option></select>
        <button class="btn btn2" id="dom_search_btn">搜索</button>
      </div>
      <div>
        <button class="btn btn1" id="dom_add_btn">+ 添加域名</button>
        <button class="btn btn2" id="dom_import_btn">批量导入</button>
        <button class="btn btn3" id="dom_del_sel">删除选中</button>
      </div>
    </div>

    <!-- 表格 -->
    <table id="dom_table">
      <thead>
        <tr>
          <th style="width:30px"><input type="checkbox" id="dom_all"></th>
          <th>域名</th>
          <th>名称</th>
          <th>标签</th>
          <th style="width:60px">状态</th>
          <th style="width:80px">操作</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <!-- 分页 -->
    <div class="pager" id="dom_pager"></div>

    <!-- 导入弹窗 -->
    <div class="modal X" id="import_modal">
      <div class="modal-box">
        <div class="modal-hd">批量导入<span class="modal-close" onclick="H('import_modal')">x</span></div>
        <textarea id="import_txt" rows="8" placeholder="每行一个：域名,名称,标签&#10;example.com,备用站,us&#10;test.com,测试"></textarea>
        <button class="btn btn1" id="import_ok">导入</button>
      </div>
    </div>

    <!-- 编辑弹窗 -->
    <div class="modal X" id="edit_modal">
      <div class="modal-box">
        <div class="modal-hd"><span id="edit_title">添加域名</span><span class="modal-close" onclick="H('edit_modal')">x</span></div>
        <input type="hidden" id="edit_id">
        <label>域名</label><input type="text" id="edit_url" class="inp" placeholder="example.com">
        <label>名称</label><input type="text" id="edit_name" class="inp" placeholder="备用站">
        <label>标签</label><input type="text" id="edit_tag" class="inp" placeholder="us">
        <button class="btn btn1" id="edit_ok">保存</button>
      </div>
    </div>
  </section>

  <!-- ===== 中继配置 ===== -->
  <section id="tab-relay" class="tab-content X">
    <div class="grid2">
      <div class="card">
        <div class="card-hd">主域名（客户访问入口） <button class="btn btn1 sm" id="relay_main_add">+ 添加</button></div>
        <ul id="relay_main_list" class="lst"></ul>
      </div>
      <div class="card">
        <div class="card-hd">中继泛域名 <button class="btn btn1 sm" id="relay_relay_add">+ 添加</button></div>
        <ul id="relay_relay_list" class="lst"></ul>
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <label>随机前缀长度</label>
      <input type="number" id="relay_len" class="inp" style="width:80px" min="2" max="16" value="4">
      <button class="btn btn1" id="relay_save">保存</button>
    </div>

    <!-- 添加中继弹窗 -->
    <div class="modal X" id="relay_modal">
      <div class="modal-box">
        <div class="modal-hd">添加域名<span class="modal-close" onclick="H('relay_modal')">x</span></div>
        <input type="hidden" id="relay_kind">
        <input type="text" id="relay_domain" class="inp" placeholder="example.com">
        <button class="btn btn1" id="relay_ok">添加</button>
      </div>
    </div>
  </section>

  <!-- ===== 站点设置 ===== -->
  <section id="tab-settings" class="tab-content X">
    <div class="card">
      <label>站点名称</label><input type="text" id="set_name" class="inp">
    </div>
    <div class="card">
      <div class="card-hd">通配落地</div>
      <label class="sw"><input type="checkbox" id="set_wc"><span></span> 启用</label>
      <div id="wc_box">
        <label>基础域名</label><input type="text" id="set_base" class="inp" placeholder="example.com">
        <div class="row2">
          <div><label>候选数量</label><input type="number" id="set_cnt" class="inp" style="width:80px" min="1" max="50"></div>
          <div><label>前缀长度</label><input type="number" id="set_plen" class="inp" style="width:80px" min="3" max="32"></div>
        </div>
      </div>
    </div>
    <div class="card">
      <label>探测资源（每行一个）</label>
      <textarea id="set_assets" rows="4" placeholder="/logo.png"></textarea>
      <label>命中阈值</label><input type="number" id="set_thr" class="inp" style="width:80px" min="1" max="20">
    </div>
    <button class="btn btn1" id="set_save">保存设置</button>
  </section>

</div>

<div class="toast X" id="toast"></div>

<script src="/admin.js"></script>
</body>
</html>
